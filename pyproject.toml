[project]
name = "hw1"
version = "0.1.0"
description = "Chinese Wikipedia word bigram / trigram language model (IR HW1)"
requires-python = ">=3.10"
dependencies = [
    "jieba==0.42.1",
    "numpy>=2.0",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "jupyter>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hw1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# jieba 0.42.1 (third-party) has invalid escape sequences in its regex literals;
# silence only that warning when it originates from the jieba package.
filterwarnings = [
    "ignore:invalid escape sequence:DeprecationWarning:.*site-packages/jieba",
]
